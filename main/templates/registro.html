{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v={{ STATIC_VERSION }}">
    <title>Registro - MyGourmet</title>
    <style>
        /* Resetando margens e padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
        }

        /* Container principal */
        .main-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 40px;
        }

        /* Container do formulário */
        .form-container {
            background-color: #fff;
            padding: 60px;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            min-height: 600px;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        /* Estilo dos campos de entrada */
        label {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        /* Estilo da checkbox */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            margin-bottom: 25px;
            cursor: pointer;
            appearance: none; /* Retira o estilo padrão */
            border: 2px solid #ccc; /* Borda da caixa */
            border-radius: 4px;
            display: inline-block;
            vertical-align: middle;
            position: relative;
        }

        /* Estilo quando a checkbox estiver marcada */
        input[type="checkbox"]:checked {
            background-color: #4CAF50; /* Cor de fundo quando marcado */
            border-color: #4CAF50;
        }

        /* Símbolo de "V" (checkmark) quando a checkbox estiver marcada */
        input[type="checkbox"]:checked::after {
            content: "✔"; /* O símbolo de "V" */
            position: absolute;
            top: 0;
            left: 3px;
            font-size: 18px;
            color: white;
        }

        label[for="morador_local"] {
            display: flex;
            align-items: center;
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        input[type="checkbox"]:focus {
            outline: none;
            box-shadow: 0 0 3px #4CAF50; /* Adiciona um destaque ao focar */
        }

        input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* Botão de registrar */
        button {
            padding: 16px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 30px;
        }

        button:hover {
            background-color: #45a049;
        }

        .forgot-password {
            text-align: center;
            display: block;
            margin-top: 30px;
            color: #007BFF;
            text-decoration: none;
            font-size: 16px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        #cpf_field {
            display: none;
        }

        /* Rolagem suave */
        html, body {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="form-container">
            <h1>Registro</h1>
            <form method="post">
                {% csrf_token %}

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <label for="senha_confirmacao">Confirme a Senha:</label>
                <input type="password" id="senha_confirmacao" name="senha_confirmacao" required>

                <!-- Caixa de seleção estilizada -->
                <label for="morador_local">
                    <input type="checkbox" id="morador_local" name="morador_local">
                    Morador Local
                </label>

                <div id="cpf_field">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf">
                </div>

                <button type="submit">Registrar</button>
            </form>

            <a href="{% url 'login_view' %}" class="forgot-password">Já tem conta? Faça login!</a>
        </div>
    </div>

    <script>
        document.getElementById('morador_local').addEventListener('change', function() {
            var cpfField = document.getElementById('cpf_field');
            if (this.checked) {
                cpfField.style.display = 'block';
            } else {
                cpfField.style.display = 'none';
            }
        });
    </script>
</body>
</html>
