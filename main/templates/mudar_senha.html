{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v={{ STATIC_VERSION }}">
    <title>Mudar Senha - MyGourmet</title>
    <style>
        /* Resetando margens e padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            font-size: 16px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 8px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn-submit {
            background-color: #4CAF50;
            color: white;
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #45a049;
        }

        .btn-back {
            margin-top: 15px;
            text-decoration: none;
            color: #4CAF50;
            font-size: 16px;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        .back-button {
            display: inline-block;  /* Permite que o botão se comporte como um bloco */
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            text-decoration: none;
            border-radius: 5px;
            width: 200px;  /* Largura fixa do botão */
            transition: background-color 0.3s ease;
            text-align: center;
            margin: 30px auto 0;  /* Isso vai garantir que o botão fique centralizado */
        }
    </style>
</head>
<body>

    <h1>Mudar Senha</h1>
    <div class="form-container">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="old_password">Senha Atual</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>

            <div class="form-group">
                <label for="new_password1">Nova Senha</label>
                <input type="password" id="new_password1" name="new_password1" required>
            </div>

            <div class="form-group">
                <label for="new_password2">Confirmar Nova Senha</label>
                <input type="password" id="new_password2" name="new_password2" required>
            </div>

            <button type="submit" class="btn-submit">Alterar Senha</button>

            {% if form.errors %}
                <div class="error-message">
                    <ul>
                        {% for field in form %}
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        </form>

        <a href="{% url menu_url %}" class="back-button">Voltar</a>
    </div>

</body>
</html>
